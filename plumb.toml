[identity]
ns = "osistack"

[release]
authority = "https://releases.osistack.perish.uk"
targets = ["x86_64-unknown-linux-gnu"]

[release.cargo]
registry = "perish"
packages = [
  "osistack-crypto",
  "osistack-wire",
  "osistack-http",
  "osistack-h1",
  "osistack-h2",
  "osistack-h3",
  "osistack-tls",
  "osistack-quic",
  "osistack",
]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "Each crate has one responsibility, ten at most."

[[layout.seat]]
path = ".cargo"
note = "Cargo registry configuration."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
note = "The actual Rust workspace and locked dependency graph."

[[layout.file]]
name = ["README.md"]
note = "Public product introduction and contribution entry."

[[layout.file]]
name = ["CREDITS.md"]
note = "The attribution registry and borrowing rules for sources osistack learns from."

[[layout.file]]
name = ["release-steps.md"]
note = "Release sequence notes. Prep only; this file does not open, stamp, or ship a release."
