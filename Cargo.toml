[workspace]
members = ["crates/wire", "crates/http", "crates/h1", "crates/h2", "crates/lib"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/PerishLab/osistack"
publish = false

[workspace.dependencies]
wire = { package = "osistack-wire", path = "crates/wire" }
http = { package = "osistack-http", path = "crates/http" }
h1 = { package = "osistack-h1", path = "crates/h1" }
h2 = { package = "osistack-h2", path = "crates/h2" }
osistack = { path = "crates/lib" }
