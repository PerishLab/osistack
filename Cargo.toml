[workspace]
members = ["crates/wire", "crates/http", "crates/h1", "crates/h2", "crates/h3", "crates/quic", "crates/tls", "crates/crypto", "crates/lib"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/PerishLab/osistack"
publish = false

[workspace.dependencies]
wire = { package = "osistack-wire", path = "crates/wire" }
http = { package = "osistack-http", path = "crates/http" }
h1 = { package = "osistack-h1", path = "crates/h1" }
h2 = { package = "osistack-h2", path = "crates/h2" }
h3 = { package = "osistack-h3", path = "crates/h3" }
quic = { package = "osistack-quic", path = "crates/quic" }
tls = { package = "osistack-tls", path = "crates/tls" }
crypto = { package = "osistack-crypto", path = "crates/crypto" }
osistack = { path = "crates/lib" }
socket = { package = "radicula-socket", version = "0", registry = "perish" }
radicula = { package = "radicula-crypto", version = "0", registry = "perish" }
